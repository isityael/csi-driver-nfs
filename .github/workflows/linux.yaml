name: Linux Unit tests
on:
    pull_request: {}
    push:
      branches:
      - isityael/dhi-hardening

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.x
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: ^1.17
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Build Test
      run: |
        go version
        export PATH=$PATH:$HOME/.local/bin
        make verify
        go test -race -covermode=atomic -coverprofile=profile.cov ./pkg/...

    - name: Authenticate to DHI
      if: github.event_name == 'push'
      env:
        DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
        DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
      run: printf '%s' "${DHI_TOKEN}" | docker login dhi.io --username "${DHI_USERNAME}" --password-stdin

    - name: Build container image
      if: github.event_name == 'push'
      run: DOCKER_CLI_EXPERIMENTAL=enabled make container

    - name: Install goveralls
      run: go install github.com/mattn/goveralls@latest

    - name: Send coverage
      if: github.event_name == 'push'
      env:
        COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: goveralls -coverprofile=profile.cov -service=github

  promote:
    name: Create fork release tag
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/isityael/dhi-hardening'
    runs-on: ubuntu-latest
    steps:
    - name: Check out complete history
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Calculate release tag
      id: release
      run: hack/next-fork-tag.sh "${FORGEJO_SHA}" >> "${GITHUB_OUTPUT}"

    - name: Create immutable Forgejo tag
      if: steps.release.outputs.create == 'true'
      env:
        RELEASE_TAG: ${{ steps.release.outputs.tag }}
        FORGEJO_API_URL: ${{ github.api_url }}
        FORGEJO_REPOSITORY: ${{ github.repository }}
        FORGEJO_TOKEN: ${{ github.token }}
      run: hack/create-forgejo-tag.sh "${RELEASE_TAG}" "${FORGEJO_SHA}"
