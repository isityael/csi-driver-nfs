name: k8s api version check
on:
    pull_request: {}
    push: {}

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # https://pluto.docs.fairwinds.com/advanced/#display-options
    - name: Download pluto
      env:
        PLUTO_VERSION: 5.24.1
        PLUTO_SHA256: 3664f9dafa9d4598aaf027604a83b0992e0181735a0d5265cbd22857a6015e50
      run: |
        archive="pluto_${PLUTO_VERSION}_linux_amd64.tar.gz"
        install_dir="${RUNNER_TEMP:-/tmp}/pluto-bin"
        mkdir -p "${install_dir}"
        curl -fsSLO "https://github.com/FairwindsOps/pluto/releases/download/v${PLUTO_VERSION}/${archive}"
        echo "${PLUTO_SHA256}  ${archive}" | sha256sum -c
        tar -xzf "${archive}" -C "${install_dir}" pluto
        echo "${install_dir}" >> "${GITHUB_PATH}"

    - name: Check deploy folder
      run: |
        pluto detect-files -d deploy

    - name: Check example folder
      run: |
        pluto detect-files -d deploy/example
