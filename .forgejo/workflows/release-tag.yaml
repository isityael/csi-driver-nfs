name: Create fork release tag

on:
  push:
    branches:
      - isityael/dhi-hardening
    paths:
      - Dockerfile
      - Dockerfile.release
      - Makefile
      - go.mod
      - go.sum
      - vendor/**
      - cmd/**
      - pkg/**
      - .woodpecker/release.yaml
      - .forgejo/workflows/release-tag.yaml
      - hack/next-fork-tag.sh
      - hack/create-forgejo-tag.sh
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Calculate release tag
        id: release
        run: hack/next-fork-tag.sh "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Create immutable release tag
        if: steps.release.outputs.create == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          FORGEJO_API_URL: ${{ github.server_url }}/api/v1
          FORGEJO_REPOSITORY: ${{ github.repository }}
          FORGEJO_TOKEN: ${{ github.token }}
        run: hack/create-forgejo-tag.sh "${RELEASE_TAG}" "${GITHUB_SHA}"
