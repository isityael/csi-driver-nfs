# CSI Driver NFS — Helm chart lint pipeline
# Runs on push/PR to isityael/dhi-hardening branch
when:
  - event: [push, pull_request]
    branch: isityael/dhi-hardening

steps:
  - name: chart-version-guard
    image: ghcr.io/isityael/chart-version-guard:main@sha256:c6698e41e94a60f922aaa8c48ce8604037cae23672e2063ff0ead4e910596156
    commands:
      # charts/ holds upstream's chart copies (latest stays v0.0.0, released
      # versions are edited in place); the deployed chart lives in helm-charts.
      - chart-version-guard check --ci woodpecker --repo . --ignore 'charts/**'

  - name: helm-lint
    image: dhi.io/helm:4.3.0-debian13-dev@sha256:cafd2ff24a457cc71b42f2e441099da417e5feae552afa6b315fe1ba3361bc67
    commands:
      - helm lint charts/latest/csi-driver-nfs
      - echo "Helm lint passed."
