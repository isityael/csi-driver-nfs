# CSI Driver NFS — Helm chart lint pipeline
# Runs on push/PR to isityael/dhi-hardening branch
when:
  - event: [push, pull_request]
    branch: isityael/dhi-hardening

steps:
  - name: chart-version-guard
    image: ghcr.io/isityael/chart-version-guard:main@sha256:dcd6f19b52f179900766a19cfc1d99bde7e4036e829994eab13009969248f64e
    commands:
      - chart-version-guard check --ci woodpecker --repo .

  - name: helm-lint
    image: dhi.io/helm:4.2.3-debian13-dev@sha256:cc75e7d23ac64803bf20fef75b6f92faca493312295157c85833f28235309dca
    commands:
      - helm lint charts/latest/csi-driver-nfs
      - echo "Helm lint passed."
