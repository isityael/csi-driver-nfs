# CSI Driver NFS — Build and push to GHCR
# Triggers on tag push (v*) or manual run
when:
  - event: tag
    ref: refs/tags/v*
  - event: manual

steps:
  - name: build-and-push
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    privileged: true
    settings:
      registry: ghcr.io
      repo: ghcr.io/isityael/nfsplugin
      dockerfile: Dockerfile.release
      build_args:
        IMAGE_VERSION: "${CI_COMMIT_TAG}"
        GIT_COMMIT: "${CI_COMMIT_SHA}"
        GO_VERSION: "1.27.1@sha256:3680233e3204827fbdc66088528ae6d4b3d034f51d03a99d454f6de034888244"
      platforms:
        - linux/amd64
      tags:
        - "${CI_COMMIT_TAG##v}"
        - "${CI_COMMIT_TAG}"
        - latest
      logins:
        - registry: ghcr.io
          username:
            from_secret: github_username
          password:
            from_secret: github_token
        - registry: dhi.io
          username:
            from_secret: dhi_username
          password:
            from_secret: dhi_password
      provenance: mode=max
      buildkit_driveropt: network=host
      cache_from: 'type=registry\,ref=ghcr.io/isityael/nfsplugin:buildcache'
      cache_to: "type=registry,ref=ghcr.io/isityael/nfsplugin:buildcache,mode=max,ignore-error=true"

  - name: trivy-scan
    failure: ignore
    image: dhi.io/trivy:0.74.0-alpine3.23-dev@sha256:d03c16fc7cd77aa5ea0a0a028f4ed89352f307304d79255460ed909537701c85
    environment:
      IMAGE_REF: "ghcr.io/isityael/nfsplugin:${CI_COMMIT_TAG}"
      TRIVY_USERNAME:
        from_secret: github_username
      TRIVY_PASSWORD:
        from_secret: github_token
    commands:
      - trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed $${IMAGE_REF}
      - trivy image --exit-code 0 --severity HIGH --ignore-unfixed $${IMAGE_REF}

  - name: cosign-sign
    image: dhi.io/cosign:3.1.3-alpine3.23-dev@sha256:f37dcc47f63eecdd9689d82c1f89190c247f66ccb8bc98d2b3a6f5675852aa10
    environment:
      IMAGE_REF: "ghcr.io/isityael/nfsplugin:${CI_COMMIT_TAG}"
      COSIGN_EXPERIMENTAL: "1"
      COSIGN_KEY:
        from_secret: cosign_key
      COSIGN_PASSWORD:
        from_secret: cosign_password
      REGISTRY_USERNAME:
        from_secret: github_username
      REGISTRY_PASSWORD:
        from_secret: github_token
    commands:
      - echo "$COSIGN_KEY" > /tmp/cosign.key
      - cosign login ghcr.io -u "$REGISTRY_USERNAME" -p "$REGISTRY_PASSWORD"
      - cosign sign --key /tmp/cosign.key --yes --registry-referrers-mode=oci-1-1 $${IMAGE_REF}
      - rm -f /tmp/cosign.key
