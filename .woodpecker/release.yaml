# CSI Driver NFS — Build and push to GHCR
# Triggers on tag push (v*) or manual run
when:
  - event: tag
    ref: refs/tags/v*
  - event: manual

steps:
  - name: build-and-push
    image: woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    privileged: true
    settings:
      registry: git.m0sh1.cc
      repo: git.m0sh1.cc/isityael/nfsplugin
      dockerfile: Dockerfile.release
      build_args:
        IMAGE_VERSION: "${CI_COMMIT_TAG}"
        GIT_COMMIT: "${CI_COMMIT_SHA}"
        GO_VERSION: "1.27.3@sha256:f20d83a83e18dbd2a4714b8ffd4b30b287b6243962dd75608e86abcc63ba4efc"
      platforms:
        - linux/amd64
      tags:
        - "${CI_COMMIT_TAG##v}"
        - "${CI_COMMIT_TAG}"
        - latest
      logins:
        - registry: git.m0sh1.cc
          username:
            from_secret: forgejo_public_package_username
          password:
            from_secret: forgejo_public_package_token
        - registry: dhi.io
          username:
            from_secret: dhi_username
          password:
            from_secret: dhi_password
      provenance: mode=max
      buildkit_driveropt: network=host
      cache_from: 'type=registry\,ref=git.m0sh1.cc/isityael/nfsplugin:buildcache'
      cache_to: "type=registry,ref=git.m0sh1.cc/isityael/nfsplugin:buildcache,mode=max,ignore-error=true"

  - name: trivy-scan
    failure: ignore
    image: dhi.io/trivy:0.74.0-alpine3.23-dev@sha256:840c5e896091d1ff1dc900be5fa69ffb2082a8c4959ac2e48429a3b702c7c70b
    environment:
      IMAGE_REF: "git.m0sh1.cc/isityael/nfsplugin:${CI_COMMIT_TAG}"
      TRIVY_USERNAME:
        from_secret: forgejo_public_package_username
      TRIVY_PASSWORD:
        from_secret: forgejo_public_package_token
    commands:
      - trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed $${IMAGE_REF}
      - trivy image --exit-code 0 --severity HIGH --ignore-unfixed $${IMAGE_REF}

  - name: cosign-sign
    image: dhi.io/cosign:3.1.4-alpine3.23-dev@sha256:aa6f94d1816fd1c1357d30dd5d3fdf2ae0228d0fa96b56f0ce08fc8a2703a066
    environment:
      IMAGE_REF: "git.m0sh1.cc/isityael/nfsplugin:${CI_COMMIT_TAG}"
      COSIGN_EXPERIMENTAL: "1"
      COSIGN_KEY:
        from_secret: cosign_key
      COSIGN_PASSWORD:
        from_secret: cosign_password
      REGISTRY_USERNAME:
        from_secret: forgejo_public_package_username
      REGISTRY_PASSWORD:
        from_secret: forgejo_public_package_token
    commands:
      - echo "$COSIGN_KEY" > /tmp/cosign.key
      - cosign login git.m0sh1.cc -u "$REGISTRY_USERNAME" -p "$REGISTRY_PASSWORD"
      - cosign sign --key /tmp/cosign.key --yes --registry-referrers-mode=oci-1-1 $${IMAGE_REF}
      - rm -f /tmp/cosign.key
